name: ci

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: the committed engine build (what Vercel serves) is not older than the engine
        run: |
          src=$(git log -1 --format=%ct -- engine/src engine/include)
          built=$(git log -1 --format=%ct -- web/public/engine)
          if [ "$src" -gt "$built" ]; then
            echo "engine/ changed after web/public/engine was committed: run make -C engine wasm and commit it"
            exit 1
          fi
      - name: native tests
        run: make -C engine test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: compare every op and optimizer with PyTorch
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python engine/tests/torch_check.py engine/build/cases.json
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - name: the committed wasm build agrees with native
        run: node engine/tests/wasm_moons.mjs
      - name: a fresh wasm build agrees with native
        run: |
          make -C engine wasm
          node engine/tests/wasm_moons.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: engine-wasm
          path: web/public/engine

  web:
    needs: engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-wasm
          path: web/public/engine
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - run: npm ci
      - run: npm test
      - name: every stepper step against an independent reference
        run: npm run verify
      - name: every training lab and race does what its text says
        run: npm run behaviour
      - run: npm run build
      - name: browser smoke test (Chromium, Firefox, WebKit)
        run: |
          npx playwright install --with-deps chromium firefox webkit
          node scripts/smoke.ts smoke-shots chromium
          node scripts/smoke.ts smoke-shots firefox
          node scripts/smoke.ts smoke-shots webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-shots
          path: web/smoke-shots
